<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balaji Taxi Service - Goa</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #1a5f7a; margin-bottom: 10px; }
        .tagline { text-align: center; color: #555; margin-bottom: 30px; }
        .contact-bar { background: #1a5f7a; color: white; padding: 15px; border-radius: 8px; 
                       text-align: center; margin-bottom: 30px; }
        .contact-bar a { color: white; text-decoration: none; font-weight: bold; margin: 0 10px; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 25px; text-decoration: none; 
               font-weight: bold; margin: 5px; }
        .btn-call { background: #28a745; color: white; }
        .btn-whatsapp { background: #25D366; color: white; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
                margin-bottom: 25px; overflow: hidden; display: flex; flex-wrap: wrap; }
        .card img { width: 100%; max-width: 350px; height: 220px; object-fit: cover; }
        .details { padding: 20px; flex: 1; min-width: 300px; }
        .details h2 { margin: 0 0 10px 0; color: #1a5f7a; }
        .details h3 { margin: 15px 0 8px 0; color: #333; font-size: 16px; }
        .details ul { margin: 0; padding-left: 20px; }
        .details li { margin-bottom: 6px; color: #444; }
        .badge { background: #1a5f7a; color: white; padding: 4px 10px; border-radius: 20px; 
                 font-size: 12px; display: inline-block; margin-bottom: 10px; }
        .notes { background: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 20px; 
                 border-left: 4px solid #ffc107; }
        @media (max-width: 768px) { .card { flex-direction: column; } .
